<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EOL in the Browser</title>
<style>
  :root { color-scheme: light dark; --bg: #fff; --fg: #1f2328; --muted: #656d76; --border: #d0d7de; --panel: #f6f8fa; --err: #cf222e; --accent: #0969da; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #0d1117; --fg: #e6edf3; --muted: #8d96a0; --border: #30363d; --panel: #161b22; --err: #ff7b72; --accent: #4493f8; }
  }
  body { margin: 0; padding: 16px; background: var(--bg); color: var(--fg); font: 15px/1.5 system-ui, sans-serif; }
  main { max-width: 900px; margin: 0 auto; display: grid; gap: 12px; }
  h1 { font-size: 1.3rem; margin: 0; }
  p { margin: 0; color: var(--muted); }
  textarea, pre { box-sizing: border-box; width: 100%; margin: 0; padding: 12px; border: 1px solid var(--border); border-radius: 6px;
                  background: var(--panel); color: var(--fg); font: 14px/1.45 ui-monospace, Menlo, Consolas, monospace; tab-size: 2; }
  textarea { height: 360px; resize: vertical; }
  pre { min-height: 120px; white-space: pre-wrap; }
  .err { color: var(--err); }
  .result { color: var(--accent); }
  button { justify-self: start; padding: 6px 16px; font: inherit; border-radius: 6px; border: 1px solid var(--border); background: var(--accent); color: #fff; cursor: pointer; }
  button:disabled { opacity: .5; cursor: default; }
</style>
</head>
<body>
<main>
  <h1>EOL in the browser</h1>
  <p>Eclipse Epsilon's EOL engine, compiled to JavaScript with TeaVM. Press Run or Ctrl/Cmd+Enter.</p>
  <textarea id="program" spellcheck="false">15.fibonacci().println();

@cached
operation Integer fibonacci() : Integer {
  if (self = 1 or self = 0) {
    return 1;
  }
  else {
    return (self-1).fibonacci() + (self-2).fibonacci();
  }
}</textarea>
  <button id="run" disabled>Loading…</button>
  <pre id="output"></pre>
</main>
<script>
const program = document.getElementById("program");
const output = document.getElementById("output");
const run = document.getElementById("run");

function show(text, cls) {
  const span = document.createElement("span");
  span.textContent = text;
  if (cls) span.className = cls;
  output.appendChild(span);
}

function runProgram() {
  output.textContent = "";
  const [stdout, stderr, result] = runEol(program.value);
  show(stdout);
  show(stderr, "err");
  if (result) show("Returned: " + result + "\n", "result");
}

run.onclick = runProgram;
program.addEventListener("keydown", e => {
  if (e.key === "Enter" && (e.ctrlKey || e.metaKey)) { e.preventDefault(); if (!run.disabled) runProgram(); }
});
</script>
<!-- UTF-8 matters: the parser's tables are encoded in non-ASCII string literals -->
<script src="teavm/classes.js" charset="utf-8"
        onload="run.disabled = false; run.textContent = 'Run';"
        onerror="show('Could not load teavm/classes.js. Run mvn package and serve target/webapp over HTTP.', 'err')"></script>
</body>
</html>
